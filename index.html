SL.forEach(s=>{const l=items(S.day,s),st=l.reduce((a,i)=>a+mi(i)[0],0);
h+=`<div class="card"><div class="row"><b>${s}</b><span><small>${r0(st)} kcal</small> <button class="lnk" data-a="pick" data-s="${s}">＋ Añadir</button></span></div>`+l.map((it,i)=>`<div class="li" data-a="edit" data-s="${s}" data-i="${i}"><div><b>${nm(it)}</b><small>${it.g?it.g+" g · ":""}${mt(mi(it))}</small></div>›</div>`).join("")+"</div>"});return h}
function vRec(){return `<input data-a="q" placeholder="Buscar receta…" value="${q}"><div class="chips">${["Todas","Desayuno","Comida","Cena"].map(c=>`<button class="chip${c==fil?" on":""}" data-a="fil" data-k="${c}">${c}</button>`).join("")}</div><div class="card" id="lst"></div>`}
function vAli(){return `<input data-a="q" placeholder="Buscar alimento…" value="${q}"><div class="card" id="lst"></div><small>Valores por 100 g (estimados). Toca para añadir al plan.</small>`}
function lst(){const n=q.toLowerCase(),e=$("#lst");if(!e)return;
if(tab=="rec")e.innerHTML=R.map((r,i)=>[r,i]).filter(([r])=>r[0].toLowerCase().includes(n)&&(fil=="Todas"||r[1].includes(fil))).map(([r,i])=>`<div class="li" data-a="pr" data-i="${i}"><div><b>${r[0]}</b><small>${r[1]} · ${mt(rmac(r))}</small></div>›</div>`).join("")||"<small>Sin resultados</small>";
else e.innerHTML=F.map((f,i)=>[f,i]).filter(([f])=>f[0].toLowerCase().includes(n)).slice(0,60).map(([f,i])=>`<div class="li" data-a="pa" data-i="${i}"><div><b>${f[0]}</b><small>${f[1]} · ${f[2]} kcal · ${f[3]}P · ${f[4]}C · ${f[5]}G</small></div>＋</div>`).join("")||"<small>Sin resultados</small>"}
function vCam(){const ex=F.map((f,i)=>[f,i]).filter(([f])=>f[6]);
return `<div class="card"><b>Convertidor de intercambios</b><select data-a="cx">${BL.map(b=>{const o=ex.filter(([f])=>f[1]==b);return o.length?`<optgroup label="${b}">${o.map(([f,i])=>`<option value="${i}"${i==S.cx?" selected":""}>${f[0]}</option>`).join("")}</optgroup>`:""}).join("")}</select>
<input type="number" inputmode="decimal" data-a="cg" value="${S.cg}"><small>Gramos del alimento de origen</small></div><div id="cres"></div>`}
function cres(){const f=F[S.cx],u=S.cg/f[6];$("#cres").innerHTML=`<div class="card"><b>${r1(u)} intercambio(s) de ${f[1]}</b><small style="display:block">${RU[f[1]]||""}</small>`+F.filter(x=>x[1]==f[1]&&x[6]).map(x=>{const g=u*x[6];return `<div class="li"><div><b>${x[0]}</b><small>${r0(x[2]*g/100)} kcal · ${r0(x[3]*g/100)}P · ${r0(x[4]*g/100)}C · ${r0(x[5]*g/100)}G</small></div><span class="q">${r1(g)} g</span></div>`}).join("")+"</div>"}
function shop(){const T={},A=(a,g)=>T[a]=(T[a]||0)+g*S.ppl;for(let d=0;d<7;d++)SL.forEach(s=>items(d,s).forEach(it=>it.r!=null?R[it.r][2].forEach((x,i)=>A(x[0],it.o[i])):A(it.a,it.g)));return T}
const un=(a,g)=>F[a][7]?` · ≈ ${Math.ceil(g/F[a][7])} ${F[a][8]}`:"";
function vCom(){const T=shop(),ids=Object.keys(T).map(Number),dn=ids.filter(a=>S.chk[a]).length;
let h=`<div class="card"><div class="row"><b>Lista semanal</b><span>${dn}/${ids.length}</span></div><div class="row"><span>Personas</span><span><button class="sb" data-a="pp" data-d="-1">−</button> <b>${S.ppl}</b> <button class="sb" data-a="pp" data-d="1">＋</button></span></div></div>`;
if(!ids.length)h+="<small>Añade recetas o alimentos en Plan para generar la lista.</small>";
BL.forEach(b=>{const l=ids.filter(a=>F[a][1]==b);if(l.length)h+=`<h3>${b}</h3><div class="card">`+l.map(a=>`<div class="li${S.chk[a]?" dn":""}" data-a="chk" data-i="${a}"><span class="bx">${S.chk[a]?"✓":""}</span><div><b>${F[a][0]}</b><small>${un(a,T[a]).slice(3)}</small></div><span class="q">${gs(T[a])}</span></div>`).join("")+"</div>"});
return h+`<button class="btn sc" data-a="cp">📋 Copiar lista</button><button class="btn sc" data-a="unck">Quitar marcas</button><button class="btn sc" data-a="ex">Cargar semana de ejemplo</button><button class="btn dg" data-a="clr">Vaciar semana</button>`}
function render(){$("#m").innerHTML={plan:vPlan,rec:vRec,ali:vAli,cam:vCam,com:vCom}[tab]();$("#nb").innerHTML=TABS.map(t=>`<button class="${t[0]==tab?"on":""}" data-a="tab" data-k="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join("");lst();if(tab=="cam")cres()}
const sel=()=>`<select data-a="dd">${DAYS.map((d,i)=>`<option value="${i}"${i==D.day?" selected":""}>${d}</option>`).join("")}</select><select data-a="ds">${SL.map(s=>`<option${s==D.slot?" selected":""}>${s}</option>`).join("")}</select>`;
function rm(){const v=mi(D.r!=null?{r:D.r,o:D.o}:{a:D.a,g:D.g});$("#rm").innerHTML=`<div class="big">${r0(v[0])} kcal</div><small>${r0(v[1])} g prot · ${r0(v[2])} g carb · ${r0(v[3])} g grasa</small>`}
function openR(r,c){const it=c.idx!=null?S.plan[c.day][c.slot][c.idx]:null;D={r,o:it?[...it.o]:R[r][2].map(x=>x[1]),day:c.day,slot:c.slot||defSl(R[r][1]),idx:c.idx!=null?c.idx:null};drawR()}
function drawR(){const r=R[D.r],ed=D.idx!=null;sh(`<div class="hd"><b>${r[0]}</b><button class="x" data-a="close">✕</button></div><small>${r[1]} · Libro: ${mt(r[3])}</small><div class="chips">${[.5,1,1.5,2].map(f=>`<button class="chip" data-a="fac" data-f="${f}">×${f}</button>`).join("")}</div>${r[2].map((x,i)=>`<label class="ig"><span>${F[x[0]][0]}</span><input type="number" inputmode="decimal" value="${D.o[i]}" data-a="og" data-i="${i}"><em>g</em></label>`).join("")}<div class="card" id="rm"></div>${ed?"":sel()}<button class="btn" data-a="sv">${ed?"Guardar cambios":"Añadir al plan"}</button>${ed?'<button class="btn dg" data-a="del">Eliminar</button>':""}<details><summary>Elaboración</summary><p>${r[4]}</p></details>`);rm()}
function openA(a,c){const f=F[a],it=c.idx!=null?S.plan[c.day][c.slot][c.idx]:null;D={a,g:it?it.g:(f[7]||f[6]||100),day:c.day,slot:c.slot||"Merienda",idx:c.idx!=null?c.idx:null};drawA()}
function drawA(){const f=F[D.a],ed=D.idx!=null;sh(`<div class="hd"><b>${f[0]}</b><button class="x" data-a="close">✕</button></div><small>${f[1]} · por 100 g: ${f[2]} kcal · ${f[3]}P · ${f[4]}C · ${f[5]}G</small><label class="ig"><span>Cantidad</span><input type="number" inputmode="decimal" value="${D.g}" data-a="fg"><em>g</em></label><div class="chips">${f[7]?`<button class="chip" data-a="sg" data-g="${f[7]}">1 ${f[8]} (${f[7]} g)</button>`:""}${f[6]?`<button class="chip" data-a="sg" data-g="${f[6]}">1 intercambio (${f[6]} g)</button>`:""}<button class="chip" data-a="sg" data-g="100">100 g</button></div><div class="card" id="rm"></div>${ed?"":sel()}<button class="btn" data-a="sv">${ed?"Guardar cambios":"Añadir al plan"}</button>${ed?'<button class="btn dg" data-a="del">Eliminar</button>':""}`);rm()}
function drawP(){sh(`<div class="hd"><b>Añadir a ${P.s}</b><button class="x" data-a="close">✕</button></div><div class="chips"><button class="chip${P.k=="r"?" on":""}" data-a="pk" data-k="r">Recetas</button><button class="chip${P.k=="a"?" on":""}" data-a="pk" data-k="a">Alimentos</button></div><input data-a="pq" placeholder="Buscar…" value="${pq}"><div id="plst"></div>`);plst()}
function plst(){const n=pq.toLowerCase(),a=P.k=="r";$("#plst").innerHTML=(a?R:F).map((x,i)=>[x,i]).filter(([x])=>x[0].toLowerCase().includes(n)).slice(0,50).map(([x,i])=>`<div class="li" data-a="${a?"pr":"pa"}" data-i="${i}" data-s="${P.s}"><div><b>${x[0]}</b><small>${a?mt(rmac(x)):x[1]}</small></div>＋</div>`).join("")}
document.addEventListener("input",e=>{const t=e.target,a=t.dataset.a;if(a=="q"){q=t.value;lst()}else if(a=="pq"){pq=t.value;plst()}else if(a=="og"){D.o[+t.dataset.i]=+t.value||0;rm()}else if(a=="fg"){D.g=+t.value||0;rm()}else if(a=="cg"){S.cg=+t.value||0;save();cres()}});
document.addEventListener("change",e=>{const t=e.target,a=t.dataset.a;if(a=="cx"){S.cx=+t.value;save();cres()}else if(a=="dd")D.day=+t.value;else if(a=="ds")D.slot=t.value});
document.addEventListener("click",e=>{if(e.target.id=="sh")return cl();const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,d=t.dataset,i=+d.i;
if(["input","select"].includes(t.tagName.toLowerCase()))return;
if(a=="tab"){tab=d.k;q="";render()}else if(a=="day"){S.day=i;save();render()}
else if(a=="fil"){fil=d.k;render()}
else if(a=="pick"){P={s:d.s,k:"r"};pq="";drawP()}else if(a=="pk"){P.k=d.k;drawP()}
else if(a=="pr")openR(i,{day:S.day,slot:d.s});else if(a=="pa")openA(i,{day:S.day,slot:d.s});
else if(a=="edit"){const it=S.plan[S.day][d.s][i],c={day:S.day,slot:d.s,idx:i};it.r!=null?openR(it.r,c):openA(it.a,c)}
else if(a=="fac"){D.o=R[D.r][2].map(x=>r1(x[1]*+d.f));drawR()}else if(a=="sg"){D.g=+d.g;drawA()}
else if(a=="sv"){const it=D.r!=null?{r:D.r,o:D.o}:{a:D.a,g:D.g};if(D.idx!=null)S.plan[D.day][D.slot][D.idx]=it;else{S.plan[D.day]=S.plan[D.day]||{};(S.plan[D.day][D.slot]=S.plan[D.day][D.slot]||[]).push(it);S.day=D.day;tab="plan"}save();cl();render()}
else if(a=="del"){S.plan[D.day][D.slot].splice(D.idx,1);save();cl();render()}
else if(a=="close")cl();
else if(a=="goal"){sh(`<div class="hd"><b>Objetivo diario</b><button class="x" data-a="close">✕</button></div>${LB.map((l,k)=>`<label class="ig"><span>${l}</span><input id="g${k}" type="number" inputmode="decimal" value="${S.goal[k]}"></label>`).join("")}<button class="btn" data-a="sgl">Guardar</button>`)}
else if(a=="sgl"){S.goal=[0,1,2,3].map(k=>+$("#g"+k).value||S.goal[k]);save();cl();render()}
else if(a=="chk"){S.chk[i]=!S.chk[i];save();render()}else if(a=="pp"){S.ppl=Math.max(1,S.ppl+ +d.d);save();render()}
else if(a=="unck"){S.chk={};save();render()}
else if(a=="clr"){if(confirm("¿Vaciar todo el plan semanal?")){S.plan={};S.chk={};save();render()}}
else if(a=="ex"){if(confirm("Esto reemplaza tu plan actual por el de ejemplo.")){S.plan=JSON.parse(JSON.stringify(DEF.plan));S.chk={};save();render()}}
else if(a=="cp"){const T=shop();let x="Lista de la compra\n";BL.forEach(b=>{const l=Object.keys(T).map(Number).filter(a=>F[a][1]==b);if(l.length)x+="\n"+b+"\n"+l.map(a=>"- "+F[a][0]+": "+gs(T[a])+un(a,T[a])).join("\n")+"\n"});
try{navigator.clipboard.writeText(x).then(()=>{t.textContent="✓ Copiado"})}catch(er){t.textContent="No se pudo copiar"}}});
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
